name: Deploy app & build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Every push → the app on everyone's phone updates (no new APK needed)
  deploy-web:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _unzipped && echo "Unzipped $z"; done
          F=$(find . -path ./node_modules -prune -o -path '*/www/index.html' -print | head -1)
          if [ -z "$F" ]; then
            echo "::error::www/index.html not found in the repo. Upload the www folder (index.html, sw.js, manifest.json, logo.png, icons/) to GitHub."
            echo "Files in repo:"; find . -path ./.git -prune -o -type f -print | head -50
            exit 1
          fi
          D=$(dirname "$(dirname "$F")")
          echo "APP_DIR=$D" >> $GITHUB_ENV
          echo "App folder: $D"
      - name: Stamp version
        run: |
          cd "$APP_DIR"
          VER=$(grep -oP "APP_VERSION='\K[^']+" www/index.html)
          echo "{\"version\":\"$VER\",\"built\":\"$(date -u +%FT%TZ)\"}" > www/version.json
          sed -i "s/konar-stock-v1/konar-stock-$VER-${GITHUB_SHA::7}/" www/sw.js
          cp www/index.html www/admin.html
          cp www/index.html www/staff.html
          echo "Version $VER"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/www
      - id: deploy
        uses: actions/deploy-pages@v4

  # 2) Builds two APKs on every push: Admin app + Staff app (download from the run's Artifacts)
  build-apk:
    needs: deploy-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: admin
            app_id: com.trmv.konarstock
            app_name: Konar Admin
            artifact: KonarStock-Admin-APK
          - edition: staff
            app_id: com.trmv.konarstock.staff
            app_name: Konar Staff
            artifact: KonarStock-Staff-APK
    steps:
      - uses: actions/checkout@v4
      - name: Find app folder
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d _unzipped && echo "Unzipped $z"; done
          F=$(find . -path ./node_modules -prune -o -path '*/www/index.html' -print | head -1)
          if [ -z "$F" ]; then
            echo "::error::www/index.html not found in the repo. Upload the www folder (index.html, sw.js, manifest.json, logo.png, icons/) to GitHub."
            echo "Files in repo:"; find . -path ./.git -prune -o -type f -print | head -50
            exit 1
          fi
          D=$(dirname "$(dirname "$F")")
          echo "APP_DIR=$D" >> $GITHUB_ENV
          echo "App folder: $D"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Move app to repo root
        run: |
          if [ "$APP_DIR" != "." ]; then cp -r "$APP_DIR"/. . ; fi
          ls
      - name: Point ${{ matrix.edition }} app to this repo's GitHub Pages URL
        env:
          PAGE_URL: ${{ needs.deploy-web.outputs.page_url }}
        run: |
          URL="$PAGE_URL"
          [ -z "$URL" ] && URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          case "$URL" in */) ;; *) URL="$URL/";; esac
          URL="${URL}${{ matrix.edition }}.html"
          python3 -c "import json,sys;p='capacitor.config.json';c=json.load(open(p));c['server']['url']=sys.argv[1];c['appId']=sys.argv[2];c['appName']=sys.argv[3];json.dump(c,open(p,'w'),indent=2)" "$URL" "${{ matrix.app_id }}" "${{ matrix.app_name }}"
          echo "App URL: $URL"; cat capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp www/icons/icon-${{ matrix.edition }}-512.png $RES/mipmap-$d/ic_launcher.png
            cp www/icons/icon-${{ matrix.edition }}-512.png $RES/mipmap-$d/ic_launcher_round.png
            cp www/icons/icon-${{ matrix.edition }}-512.png $RES/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf $RES/mipmap-anydpi-v26
      - name: Permissions (backup to Documents, fingerprint)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "permission\|requestLegacy" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Fixed signing key (so new APKs install over old ones without uninstalling)
        run: |
          mkdir -p ~/.android
          if [ -f keystore/debug.keystore ]; then cp keystore/debug.keystore ~/.android/debug.keystore; fi
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.artifact }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.apk
