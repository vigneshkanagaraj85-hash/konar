name: Deploy app & build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) Every push → the app on everyone's phone updates (no new APK needed)
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          VER=$(grep -oP "APP_VERSION='\K[^']+" www/index.html)
          echo "{\"version\":\"$VER\",\"built\":\"$(date -u +%FT%TZ)\"}" > www/version.json
          sed -i "s/konar-stock-v1/konar-stock-$VER-${GITHUB_SHA::7}/" www/sw.js
          echo "Version $VER"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  # 2) Run manually (Actions → Run workflow) → builds the APK once
  build-apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp www/icons/icon-512.png $RES/mipmap-$d/ic_launcher.png
            cp www/icons/icon-512.png $RES/mipmap-$d/ic_launcher_round.png
            cp www/icons/icon-512.png $RES/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf $RES/mipmap-anydpi-v26
      - name: Storage permission (backup to Documents on Android 10 and below)
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "permission\|requestLegacy" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk KonarStock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KonarStock-APK
          path: KonarStock.apk
